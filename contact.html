<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airpost — Contact</title>

<style>
body{
  margin:0;
  font-family: Georgia, "Times New Roman", serif;
  color:#111;
}

/* Header */
header{
  text-align:center;
  padding-top:40px;
}
.logo{font-size:42px;}
nav{margin-top:10px;font-style:italic;}
nav a{margin:0 14px;text-decoration:none;color:#333;}
nav a:hover{border-bottom:1px solid #888;}
.line{margin-top:18px;border-top:1px solid #e6e6e6;}

.container{max-width:1100px;margin:auto;padding:40px 20px;}

h1{text-align:center;font-size:38px;margin-top:60px;}
.subtitle{text-align:center;color:#666;font-style:italic;margin-bottom:60px;}

.split{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
}

/* left info */
.info{padding-right:40px;border-right:1px solid #e6e6e6;}
.info h3{margin-top:40px;font-weight:normal;}
.info p{color:#555;font-style:italic;}

/* form */
form label{display:block;margin-top:20px;}
input, textarea{
  width:100%;
  padding:10px;
  border:1px solid #ccc;
  margin-top:6px;
  font-family:inherit;
}
textarea{height:120px;}

button{
  margin-top:20px;
  width:100%;
  padding:12px;
  background:#444;
  color:white;
  border:none;
}
button:hover{background:black}

/* footer */
footer{text-align:center;margin:80px 0 40px;color:#777;font-size:13px;}

@media(max-width:900px){
  .split{grid-template-columns:1fr;}
  .info{border-right:none;border-bottom:1px solid #e6e6e6;padding-bottom:30px;}
}
</style>
</head>

<body>

<header>
  <div class="logo">Airpost</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="index.html#shop">Shop</a>
    <a href="contact.html">Contact</a>
  </nav>
  <div class="line"></div>
</header>

<div class="container">

<h1>Contact</h1>
<p class="subtitle">
If you have any questions, feel free to leave a message below.
We will reply within 2–3 business days.
</p>

<div class="split">

<div class="info">
  <h3>Email</h3>
  <p>airpost.brand@gmail.com</p>

  <h3>Instagram</h3>
  <p>@airpost</p>

  <h3>Location</h3>
  <p>Merced, California</p>
</div>

<form>
  <label>Name</label>
  <input type="text">

  <label>Email</label>
  <input type="email">

  <label>Message</label>
  <textarea></textarea>

  <button type="submit">Send</button>
</form>

</div>
</div>

<footer>
© 2026 Airpost — A Letter To Your Heart
</footer>

</body>
</html>
